<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSOC Staff System TEST</title><link rel="stylesheet" href="./styles.css"></head><body>
<div class="test-banner">TEST環境　v0.3.3　※画面・仕様確認用／実運用データではありません</div>
<section id="loginView" class="login-wrap">
 <div class="login-card"><div class="brand"><strong>TSOC Staff System</strong><span>職員申請・承認システム</span></div><h1>ログイン</h1><p class="muted">職員IDとパスワードを入力してください。</p>
 <form id="loginForm"><label>職員ID<input id="loginId" autocomplete="username" placeholder="例：TSOC-0001" required></label><label>パスワード<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="full" type="submit">ログイン</button></form>
 <div class="demo-box"><b>テスト用ログイン</b><p>TSOC-0001：申請のみ　／　TSOC-0002：承認担当あり　／　TSOC-0003：管理権限あり</p><p>パスワードはすべて <code>test</code></p></div>
 </div>
</section>
<div id="systemView" class="hidden">
<header><div><strong>TSOC Staff System</strong><span id="headerRole"></span></div><div class="header-actions"><span id="headerUser"></span><button id="logoutBtn" class="ghost">ログアウト</button></div></header>
<div class="shell"><aside><nav id="nav"></nav></aside><main id="content"></main></div>
</div><div id="toast"></div><script src="./app.js"></script></body></html>
